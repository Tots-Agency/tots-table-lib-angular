<mat-form-field class="{{getClasses()}}" [appearance]="getAppearance()" (click)="$event.stopPropagation()">
	@if (getLabel()) {
  		<mat-label>
			{{ getLabel() }}
		</mat-label>
	}

	<mat-select [formControl]="input" [placeholder]="getPlaceholder()">
		@for (option of options; track $index) {
			<mat-option [value]="getOptionValue(option)">
				{{ displayOption(option) }}
			</mat-option>
		}
	</mat-select>

	@if (getCaption()) {
  		<mat-hint [align]="'end'">
			{{ getCaption() }}
		</mat-hint>
	}

	@if (hasError()) {
  		<mat-error>
			{{ getErrorMessage() }}
		</mat-error>
	}
</mat-form-field>
